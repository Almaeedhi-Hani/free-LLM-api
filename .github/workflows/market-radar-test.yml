name: Market Radar Test (temporary)

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Call market radar endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "${CRON_SECRET}" ]; then echo "CRON_SECRET is missing"; exit 1; fi
          code=$(curl -sS -o response.json -w "%{http_code}" \
            -X POST "https://free-llm-api-1-didl.onrender.com/api/admin/market/radar" \
            -H "x-admin-secret: ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            -d '{"triggered_by":"github_actions"}')
          echo "HTTP ${code}"
          cat response.json
          test "${code}" = "200"
