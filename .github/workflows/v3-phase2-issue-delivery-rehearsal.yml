# One-time isolated and explicitly SYNTHETIC GitHub Actions issue channel test.
# NEVER merge this workflow onto main; automatically resolves its own test issue.
name: V3 Phase 2 synthetic issue delivery rehearsal
on:
  push:
    branches: [chore/phase2-issue-delivery-rehearsal-20261120]
    paths: ['.github/workflows/v3-phase2-issue-delivery-rehearsal.yml']
permissions:
  contents: read
  issues: write
jobs:
  exercise:
    if: github.repository == 'Almaeedhi-Hani/free-LLM-api'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Create, deduplicate and resolve a clearly synthetic GitHub Issue
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const {createClient}=require('./scripts/v3-phase2-monitor.cjs');
          const client=createClient({repository:process.env.GITHUB_REPOSITORY,token:process.env.GH_TOKEN});
          const title='[V3 rehearsal only] Phase 2 synthetic issue delivery 2026-11-20';
          const body='SYNTHETIC CI REHEARSAL ONLY. No production W01-W06 incident, provider call, publication or real scheduled failure. This tests GitHub Actions issue write and deduplication.';
          (async()=>{
            const before=await client.upsertIssue({title,body,label:'failure'});
            if(!['created','updated'].includes(before.result))throw Error('Cannot create/update rehearsal Issue');
            const repeat=await client.upsertIssue({title,body:body+'\\nRepeat check: exact same issue ID.',label:'failure'});
            if(repeat.result!=='updated'||repeat.number!==before.number)throw Error('Dedup failed');
            const closed=await client.resolveIssue(title,body+'\\nRehearsal completed and auto-closed.');
            if(closed.result!=='resolved'||closed.number!==before.number)throw Error('Issue resolution failed');
            console.log('V3_PHASE2_REHEARSAL_SUCCESS issue='+before.number+' created_or_updated='+before.result+' dedup=true closed=true');
          })().catch(error=>{console.error('REHEARSAL FAILED '+error.message);process.exitCode=1;});
          NODE
