# Temporary phase-1 rollback ref bootstrap; remove once verified, never merge to main.
name: Phase 1 fixed rollback tag bootstrap
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/phase1-tag-bootstrap.yml'
permissions:
  contents: write
jobs:
  create-fixed-tag:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/phase1-scheduled-reliability-20261119' && github.event.pull_request.base.sha == 'c0ad3444fb04acd08d25e1ce11e6e7e6cf4217b1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Create or verify exact pre-phase1 tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="pre-phase1-20261119"
          expected="c0ad3444fb04acd08d25e1ce11e6e7e6cf4217b1"
          if existing="$(gh api "repos/$REPO/git/ref/tags/$tag" --jq '.object.sha' 2>/dev/null)"; then
            if [[ "$existing" != "$expected" ]]; then
              echo "Existing rollback tag has unexpected commit"; exit 1
            fi
          else
            gh api --method POST "repos/$REPO/git/refs" -f "ref=refs/tags/$tag" -f "sha=$expected" >/dev/null
          fi
          verified="$(gh api "repos/$REPO/git/ref/tags/$tag" --jq '.object.sha')"
          [[ "$verified" == "$expected" ]] || { echo "Tag verification failed"; exit 1; }
          echo "Phase 1 rollback tag verified against immutable pre-stage main"
