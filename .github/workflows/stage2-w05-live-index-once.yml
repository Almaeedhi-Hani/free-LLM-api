name: One-time W05 live index readback no publishing
on:
  push:
    branches: [verification/stage2-w05-real-index-20261123]
    paths:
      - .github/workflows/stage2-w05-live-index-once.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: 
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify W05 feed invariants offline
        run: |
          node scripts/llm-agent-index.test.cjs
          node scripts/llm-feed-contract.test.cjs
      - name: Fetch canonical public feed and evaluate local index only
        run: |
          set -euo pipefail
          node scripts/llm-agent-index.cjs --update
          git diff --check
          changed="$(git diff --name-only)"
          if [ -n "$changed" ] && [ "$changed" != "public/llms.txt" ]; then
            echo 'W05_VERIFY unrelated_changes' >&2; exit 1
          fi
          echo "W05_VERIFY real_live_feed=success changed=$([ -n "$changed" ] && echo true || echo false) no_pr=true no_publishing=true"
