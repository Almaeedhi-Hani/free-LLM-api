# One-time removal of an exact already-merged bot branch.
# NEVER merge this workflow to main. Does not touch public content or DB.
name: V3 one-time merged LLM index bot branch cleanup
on:
  push:
    branches:
      - chore/one-time-llm-index-branch-cleanup-20261123
    paths:
      - '.github/workflows/v3-onetime-llm-branch-cleanup.yml'
permissions:
  contents: write
  pull-requests: read
jobs:
  cleanup:
    if: github.repository == 'Almaeedhi-Hani/free-LLM-api' && github.ref == 'refs/heads/chore/one-time-llm-index-branch-cleanup-20261123'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify merged PR number, exact bot head, then delete only that ref
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: '217'
          EXPECTED_SHA: 5204c72d6c339138ef9d0d3fd98ebdf126553624
          BOT_REF: bot/llm-agent-index
        shell: bash
        run: |
          set -euo pipefail
          pr_merged="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.merged')"
          pr_head="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha')"
          test "$pr_merged" = 'true' || { echo '::error::PR not merged'; exit 1; }
          test "$pr_head" = "$EXPECTED_SHA" || { echo '::error::Unexpected bot head; refuse'; exit 1; }
          if ! ref_json="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$BOT_REF" 2>/dev/null)"; then
            echo "V3_LLM_BRANCH_CLEANUP already_absent (safe)"
            exit 0
          fi
          actual="$(printf '%s' "$ref_json" | jq -r '.object.sha')"
          test "$actual" = "$EXPECTED_SHA" || { echo '::error::Bot branch moved; refuse'; exit 1; }
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$BOT_REF" >/dev/null
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$BOT_REF" >/dev/null 2>&1; then
            echo '::error::Bot ref still present'
            exit 1
          fi
          echo "V3_LLM_BRANCH_CLEANUP success pr=$PR_NUMBER sha=$EXPECTED_SHA"
