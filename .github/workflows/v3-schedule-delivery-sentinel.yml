name: V3 schedule delivery sentinel (temporary)
# Temporary isolated diagnostic: proves whether GitHub sends ANY 5m schedule
# to a minimal workflow on the active main branch. Remove after diagnosis.
on:
  schedule:
    - cron: '1,6,11,16,21,26,31,36,41,46,51,56 * * * *'
  # Smoke test creates an explicit push run, NOT schedule evidence.
  push:
    branches: [main]
    paths:
      - '.github/workflows/v3-schedule-delivery-sentinel.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read # narrow GitHub workflow-registry inspection only
concurrency:
  group: v3-schedule-delivery-sentinel
  cancel-in-progress: false
jobs:
  prove-github-scheduler:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Identify actual trigger and scheduled clock
        env:
          TRIGGER_CRON: ${{ github.event.schedule }}
        shell: bash
        run: |
          set -euo pipefail
          echo "SENTINEL event=$GITHUB_EVENT_NAME ref=$GITHUB_REF cron=${TRIGGER_CRON:-none} run=$GITHUB_RUN_ID"
          echo "SENTINEL utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            if [ "$TRIGGER_CRON" != '1,6,11,16,21,26,31,36,41,46,51,56 * * * *' ]; then
              echo "::error::Unexpected scheduled trigger"; exit 1
            fi
            echo "SENTINEL REAL_GITHUB_SCHEDULE_DELIVERED"
          else
            echo "SENTINEL NOT_SCHEDULE; a successful push is not scheduling evidence"
          fi
      - name: Inspect GitHub scheduler registrations (read-only)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          command -v gh >/dev/null
          registry="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows?per_page=100")"
          for file in v3-unified-sequential-test.yml gsc-daily-sync.yml v3-phase2-safety-monitor.yml v3-stage2-quality-watch.yml v3-schedule-delivery-sentinel.yml; do
            state="$(printf '%s' "$registry" | jq -r --arg path ".github/workflows/$file" '.workflows[]? | select(.path == $path) | .state' | head -1)"
            workflow_id="$(printf '%s' "$registry" | jq -r --arg path ".github/workflows/$file" '.workflows[]? | select(.path == $path) | .id' | head -1)"
            echo "SENTINEL_REGISTRY file=$file id=${workflow_id:-unknown} state=${state:-missing}"
            if [ "$state" != active ]; then
              echo "::error::Required GitHub scheduled workflow is not active: $file"
              exit 1
            fi
          done
          recent="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?event=schedule&per_page=5")"
          printf '%s' "$recent" | jq -r '.workflow_runs[]? | "SENTINEL_SCHEDULE_HISTORY id=\(.id) name=\(.name) created_at=\(.created_at)"'
          echo "SENTINEL_REGISTRY read_only=success"
      - name: Publish diagnostic summary
        env:
          TRIGGER_CRON: ${{ github.event.schedule }}
        run: |
          {
            echo '## GitHub cron delivery diagnostic (isolated)'
            echo "- Event: $GITHUB_EVENT_NAME"
            echo "- Cron: ${TRIGGER_CRON:-none}"
            echo "- Runner UTC: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "- SHA: $GITHUB_SHA"
            echo 'No provider calls, writes, publishing, or service credentials.'
          } >> "$GITHUB_STEP_SUMMARY"
