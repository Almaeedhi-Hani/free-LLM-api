name: One-time GSC service account verified sync (manual isolated)
on:
  push:
    branches:
      - verification/gsc-service-account-manual-20261123
    paths:
      - .github/workflows/gsc-service-account-one-time-20261123.yml
permissions:
  contents: read
concurrency:
  group: gsc-measured-sync
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Make one authorized GSC sync request and print only bounded status
        env:
          GSC_SYNC_URL: ${{ secrets.GSC_SYNC_URL }}
          GSC_CRON_SECRET: ${{ secrets.GSC_CRON_SECRET }}
        run: |
          node <<'NODE'
          const url=process.env.GSC_SYNC_URL;
          const secret=process.env.GSC_CRON_SECRET;
          if(!url || !secret){console.log('GSC_VERIFY missing_approved_actions_configuration');process.exit(1)}
          (async()=>{
            let response;
            try{response=await fetch(url,{headers:{authorization:'Bearer '+secret},signal:AbortSignal.timeout(90000)})}
            catch{console.log('GSC_VERIFY transport_failure');process.exitCode=1;return}
            let data={};
            try{data=await response.json()}catch{}
            const permitted=['status','error','operator_action','retryable','date','stored','page_rows','page_data_status','attempted','remaining','eligible_through'];
            const safe={};for(const k of permitted)if(['string','number','boolean'].includes(typeof data[k])) safe[k]=data[k];
            if(Array.isArray(data.days))safe.days=data.days.map(d=>({date:d.date,status:d.status,rows_fetched:d.rows_fetched,failure:d.failure})).slice(0,3);
            console.log('GSC_VERIFY http_status='+response.status+' result='+JSON.stringify(safe).slice(0,1200));
            if(!response.ok||data.status==='partial_failure'||data.status==='error')process.exitCode=1;
          })().catch(()=>{console.log('GSC_VERIFY unexpected_failure');process.exitCode=1});
          NODE
