name: Admin seven-hub real browser acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/app/admin/dashboard/page.tsx'
      - 'src/components/UnifiedRunHistory.tsx'
      - 'src/components/VisibilityDashboard.tsx'
      - 'src/components/ContentImpactCenter.tsx'
      - 'src/components/PackageRequestsAdmin.tsx'
      - 'src/components/WhatsAppFloat.tsx'
      - 'scripts/whatsapp-responsive-browser-e2e.cjs'
      - 'scripts/admin-seven-hubs-browser-e2e.cjs'
      - 'scripts/admin-18-functional-acceptance-browser.cjs'
      - '.github/workflows/admin-seven-hubs-browser.yml'
      - 'docs/plans/**' # phase gate: run acceptance on plan/progress changes
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-seven-hubs-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ADMIN_SECRET: isolated-seven-hubs-admin-secret
      E2E_ADMIN_SECRET: isolated-seven-hubs-admin-secret
      CONTENT_STORE_PATH: /tmp/seven-hubs-content.json
      MARKET_INTEL_PATH: /tmp/seven-hubs-market
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Install isolated headless Chromium
        run: |
          npm install --no-save playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Boot isolated admin, no production database
        run: |
          mkdir -p "$MARKET_INTEL_PATH"
          nohup npm run dev -- --hostname 127.0.0.1 --port 3100 >/tmp/admin-seven-hubs.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS --max-time 3 http://127.0.0.1:3100/admin/dashboard >/dev/null; then exit 0; fi
            sleep 2
          done
          tail -100 /tmp/admin-seven-hubs.log
          exit 1
      - name: Verify all seven hub groups, 18 child pages, mobile and logout
        run: node scripts/admin-seven-hubs-browser-e2e.cjs
      - name: Test 18 admin screens, real CRUD buttons and local write/readbacks
        run: node scripts/admin-18-functional-acceptance-browser.cjs
      - name: Verify 280x315 responsive WhatsApp panel in headless Chromium
        run: node scripts/whatsapp-responsive-browser-e2e.cjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: admin-seven-hubs-browser-screenshot
          path: /tmp/admin-seven-hubs-browser-failure.png
          retention-days: 7
          if-no-files-found: ignore
