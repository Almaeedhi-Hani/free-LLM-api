name: V3 Production Workflow Failure Alerts
on:
  workflow_run:
    workflows:
      - GEO Intelligence Analysis
      - Market Intelligence Radar (Independent)
      - GEO Daily Auto Publication
      - GSC daily metrics sync
      - LLM Agent Feed Quality & Index
      - Autonomous Site Maintenance (bounded)
    types: [completed]
permissions:
  contents: read
  issues: write
concurrency:
  group: v3-failure-alert-${{ github.event.workflow_run.workflow_id }}
  cancel-in-progress: false
jobs:
  alert:
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Only checkout the trusted default branch, never the triggering run's head.
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify event name allowlist and dedup behavior
        run: node scripts/v3-ops-monitor.test.cjs
      - name: Create or update one fixed failure Issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ALLOW_ISSUE_WRITE: 'true'
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          FAILED_WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          FAILED_RUN_ID: ${{ github.event.workflow_run.id }}
        run: node scripts/v3-ops-monitor.cjs --mode=failure
