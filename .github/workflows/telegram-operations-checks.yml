name: Telegram operations checks
on:
  pull_request:
    paths:
      - 'src/lib/telegram-ops-core.cjs'
      - 'src/app/api/telegram/operations/**'
      - 'scripts/telegram-ops.test.cjs'
      - '.github/workflows/telegram-operations-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/telegram-ops.test.cjs
