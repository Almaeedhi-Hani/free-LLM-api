name: Telegram operations checks
on:
  pull_request:
    paths:
      - 'src/lib/telegram-ops-core.cjs'
      - 'src/lib/telegram-ops-coordinator.cjs'
      - 'scripts/telegram-coordinator.test.cjs'
      - 'src/lib/telegram-ops-phase2.cjs'
      - 'src/lib/telegram-ops-notifier.ts'
      - 'src/lib/telegram-ops-advanced*'
      - 'src/lib/telegram/**'
      - 'src/lib/telegram-voice-providers.cjs'
      - 'scripts/telegram-voice-providers.test.cjs'
      - 'scripts/telegram-advanced.test.cjs'
      - 'src/app/api/cron-central/**'
      - 'src/app/api/admin/telegram/**'
      - 'supabase/migrations/*telegram_ops*'
      - 'scripts/telegram-phase2.test.cjs'
      - 'src/app/api/telegram/operations/**'
      - 'scripts/telegram-ops.test.cjs'
      - '.github/workflows/telegram-operations-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: node --test scripts/telegram-ops.test.cjs scripts/telegram-phase2.test.cjs scripts/telegram-advanced.test.cjs scripts/telegram-coordinator.test.cjs scripts/telegram-voice-providers.test.cjs
      - run: node scripts/v3-supabase-central.test.cjs
      - run: npm run build
