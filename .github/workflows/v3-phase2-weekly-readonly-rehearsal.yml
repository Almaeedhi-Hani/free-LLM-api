# ONE-TIME and branch-scoped: read-only Stage-2 storage proof, never merge.
name: V3 Phase 2 isolated readonly weekly evidence rehearsal
on:
  push:
    branches: [chore/phase2-readonly-weekly-rehearsal-20261120]
    paths: ['.github/workflows/v3-phase2-weekly-readonly-rehearsal.yml']
permissions:
  contents: read
jobs:
  readback:
    if: github.repository == 'Almaeedhi-Hani/free-LLM-api'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Existing report fixtures must pass before querying data
        run: node scripts/v3-phase2-monitor.test.cjs
      - name: Read only existing storage and summarize status; no GitHub Issues
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const {readWeeklyEvidence,readGscMeasured,readStorage}=require('./scripts/v3-phase2-monitor.cjs');
          (async()=>{
            const now=Date.now(),url=process.env.SUPABASE_URL,key=process.env.SUPABASE_SERVICE_ROLE_KEY;
            const [e,gsc,...storage]=await Promise.all([
              readWeeklyEvidence({url,key,now}),readGscMeasured({url,key}),
              ...['W01','W02','W03','W04'].map(id=>readStorage(id,{url,key}))
            ]);
            const summary={kind:'synthetic_read_only_rehearsal_not_schedule',
              observed_at_utc:new Date(now).toISOString(),
              keyword_feedback:{status:e.feedback.status,sample_size:e.feedback.sampleSize||0,
                counts:e.feedback.status==='observed'?e.feedback.counts:undefined,
                reason:e.feedback.status==='unknown'?e.feedback.reason:undefined},
              gsc_page:{status:e.page.status,date:e.page.date,path:e.page.path,
                impressions:e.page.impressions,clicks:e.page.clicks,reason:e.page.reason},
              gsc_total:{status:gsc.status,date:gsc.latestDate,impressions:gsc.impressions,
                clicks:gsc.clicks,reason:gsc.note},
              persisted:storage.map((row,i)=>({workflow:['W01','W02','W03','W04'][i],
                status:row.status,time:row.latestTimestamp,reason:row.note}))};
            console.log('V3_PHASE2_READONLY_PROOF '+JSON.stringify(summary));
            if(e.feedback.status!=='observed'||e.page.status!=='observed'||
                gsc.status!=='observed'||storage.some(x=>x.status!=='observed'))
              process.exitCode=2;
          })().catch(err=>{console.error('V3_PHASE2_READONLY_FAILED '+err.message.slice(0,90));process.exitCode=1;});
          NODE
