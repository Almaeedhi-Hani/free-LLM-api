name: GEO Dashboard Live Readback One Time
on:
  push:
    branches:
      - fix/search-source-reliability-20261114
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dashboard-readback:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Read secured dashboard API without writing data
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: node scripts/geo-dashboard-read-only-check.cjs
