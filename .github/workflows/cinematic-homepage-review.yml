name: Cinematic homepage browser review
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/components/CinematicHero.tsx'
      - 'src/components/home/**'
      - 'src/components/discovery/**'
      - 'src/components/EditorialBlock.tsx'
      - 'src/app/insights/**'
      - 'src/components/services/**'
      - 'src/components/packages/**'
      - 'src/components/ServicePage.tsx'
      - 'src/components/PackagesLanding.tsx'
      - 'src/app/packages/PackageRequest.tsx'
      - 'src/lib/services/**'
      - 'src/lib/packages/**'
      - 'src/lib/market/**'
      - 'src/lib/market-intelligence.ts'
      - 'src/components/layout/**'
      - 'src/components/admin/dashboard/**'
      - 'src/lib/admin/dashboard/**'
      - 'src/app/admin/dashboard/page.tsx'
      - 'scripts/support/admin-dashboard-source.cjs'
      - 'src/components/residency/**'
      - 'src/components/PremiumResidencyPage.tsx'
      - 'src/lib/residency/**'
      - 'src/app/layout.tsx'
      - 'src/styles/**'
      - 'src/app/globals.css'
      - 'src/app/page.tsx'
      - 'src/lib/home/**'
      - 'scripts/project-architecture.test.cjs'
      - 'scripts/support/global-styles.cjs'
      - 'scripts/cinematic-homepage.browser.cjs'
      - 'scripts/reference-color-contract.test.cjs'
      - 'src/components/WhatsAppFloat.tsx'
      - 'src/components/CookieConsent.tsx'
      - 'src/components/InvestorAnalytics.tsx'
      - 'src/lib/investor-events.ts'
      - 'src/app/api/investor-events/**'
      - 'src/lib/public-content.ts'
      - 'scripts/investor-events.test.cjs'
      - 'scripts/investor-experience.browser.cjs'
      - 'src/components/PremiumResidencyPage.module.css'
      - '.github/workflows/cinematic-homepage-review.yml'
permissions:
  contents: read
jobs:
  browser-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
      NODE_ENV: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install locked app dependencies
        run: npm ci --include=dev
      - name: Install isolated browser test tools (no app dependency changes)
        run: |
          npm install --prefix /tmp/cinematic-tools --no-save --package-lock=false playwright@1.51.1 axe-core@4.10.3
          /tmp/cinematic-tools/node_modules/.bin/playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk fonts-noto-core
      - name: Verify committed local poster bytes
        run: |
          printf '%s\n' 'afb2873e2d42dcbbcd8a063e77491cc597ea6ab959ca9eb99497ed110aa7a8eb  public/media/riyadh-monochrome.webp' '42be2b340ec5932a28b21bf8ed95d13d6edec60bcb45edef5acf1c02b8f8c890  public/media/riyadh-monochrome-mobile.webp' | sha256sum -c -
      - name: Run static and navigation checks
        run: |
          node scripts/project-architecture.test.cjs
          node scripts/reference-color-contract.test.cjs
          node scripts/cinematic-homepage.test.cjs
          node scripts/mobile-header-contract.test.cjs
          node scripts/phase6-navigation-contract.test.cjs
          node scripts/admin-dashboard-contract.test.cjs
          npm run test:packages
          npm run test:whatsapp
          npx --no-install tsc src/lib/investor-events.ts --outDir .investor-test-build --module commonjs --target es2020 --skipLibCheck --strict --types node
          node scripts/investor-events.test.cjs
          npx --no-install tsc src/lib/premium-residency-content.ts --outDir .residency-test-build --module commonjs --target es2020 --lib es2020,dom --moduleResolution node --esModuleInterop --skipLibCheck --strict --types node
          node --test scripts/premium-residency-content.test.cjs
      - name: Verify exact pre-refactor CSS and markup parity
        if: github.head_ref == 'refactor/project-architecture-foundation'
        run: |
          git fetch --no-tags --depth=1 origin 169a8f7a1cf8ad0d794df29af8e9b8694c92d490
          node scripts/project-architecture.test.cjs 169a8f7a1cf8ad0d794df29af8e9b8694c92d490
      - name: Start isolated development fixture
        run: |
          (SITE_URL=http://127.0.0.1:3000 npm run dev -- -p 3000 > /tmp/cinematic-dev.log 2>&1 &)
          ready=0
          for i in $(seq 1 45); do
            if curl -fsS --max-time 15 http://127.0.0.1:3000/ >/dev/null 2>&1; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" != "1" ]; then tail -80 /tmp/cinematic-dev.log; exit 1; fi
      - name: Capture and check actual rendered Next.js pages
        run: |
          NODE_PATH=/tmp/cinematic-tools/node_modules node scripts/cinematic-homepage.browser.cjs
          NODE_PATH=/tmp/cinematic-tools/node_modules node scripts/investor-experience.browser.cjs
      - name: Upload screenshots and browser results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cinematic-homepage-screenshots
          path: cinematic-screenshots/
          retention-days: 7
          if-no-files-found: warn
