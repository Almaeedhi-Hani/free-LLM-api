name: Cinematic homepage browser review
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/components/CinematicHero.tsx'
      - 'scripts/cinematic-homepage.browser.cjs'
      - '.github/workflows/cinematic-homepage-review.yml'
permissions:
  contents: read
jobs:
  prepare-poster:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Acquire licensed public Riyadh photograph
        run: |
          mkdir -p poster
          curl --fail --location --retry 3 --max-time 60 --silent --show-error 'https://images.pexels.com/photos/31849530/pexels-photo-31849530.jpeg?auto=compress&cs=tinysrgb&w=1600&fm=webp&q=72' -o poster/riyadh-monochrome.webp
          curl --fail --location --retry 3 --max-time 60 --silent --show-error 'https://images.pexels.com/photos/31849530/pexels-photo-31849530.jpeg?auto=compress&cs=tinysrgb&w=760&fm=webp&q=65' -o poster/riyadh-monochrome-mobile.webp
          python3 - <<'PY'
          import pathlib,base64,hashlib
          for f in sorted(pathlib.Path('poster').glob('*.webp')):
              b=f.read_bytes()
              assert b[:4]==b'RIFF' and b[8:12]==b'WEBP',f'Invalid image {f}'
              assert 1000<len(b)<500000,f'Unexpected image size {f}'
              print('POSTER_SHA256',f.name,hashlib.sha256(b).hexdigest(),len(b))
              encoded=base64.b64encode(b).decode()
              for i in range(0,len(encoded),3000): print('POSTER64',f.name,i//3000,encoded[i:i+3000])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: licensed-riyadh-poster
          path: poster/
          retention-days: 7
  browser-review:
    needs: prepare-poster
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
      NODE_ENV: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install locked app dependencies
        run: npm ci --include=dev
      - name: Install isolated browser test tools (no app dependency changes)
        run: |
          npm install --prefix /tmp/cinematic-tools --no-save --package-lock=false playwright@1.51.1 axe-core@4.10.3
          /tmp/cinematic-tools/node_modules/.bin/playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk fonts-noto-core
      - name: Run static and navigation checks
        run: |
          node scripts/cinematic-homepage.test.cjs
          node scripts/mobile-header-contract.test.cjs
          npm run test:packages
          npm run test:whatsapp
      - uses: actions/download-artifact@v4
        with:
          name: licensed-riyadh-poster
          path: public/media
      - name: Start isolated development fixture
        run: |
          (npm run dev -- -p 3000 > /tmp/cinematic-dev.log 2>&1 &)
          ready=0
          for i in $(seq 1 45); do
            if curl -fsS --max-time 15 http://127.0.0.1:3000/ >/dev/null 2>&1; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" != "1" ]; then tail -80 /tmp/cinematic-dev.log; exit 1; fi
      - name: Capture and check actual rendered Next.js pages
        run: NODE_PATH=/tmp/cinematic-tools/node_modules node scripts/cinematic-homepage.browser.cjs
      - name: Upload screenshots and browser results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cinematic-homepage-screenshots
          path: cinematic-screenshots/
          retention-days: 7
          if-no-files-found: warn
