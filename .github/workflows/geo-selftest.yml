name: Geo Selftest (temporary)

on:
  workflow_dispatch:
    inputs:
      phase:
        description: 'setup | verify | cleanup'
        required: true
        default: 'setup'

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Call geo-store selftest endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PHASE: ${{ inputs.phase }}
        run: |
          if [ -z "${CRON_SECRET}" ]; then echo "CRON_SECRET is missing"; exit 1; fi
          code=$(curl -sS -o response.json -w "%{http_code}" \
            -X POST "https://free-llm-api-1-didl.onrender.com/api/admin/geo-selftest?phase=${PHASE}" \
            -H "x-admin-secret: ${CRON_SECRET}")
          echo "HTTP ${code}"
          cat response.json
          test "${code}" = "200"
