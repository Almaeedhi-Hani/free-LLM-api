name: Market Intelligence Radar (Daily)

on:
  # Periodic schedule intentionally DISABLED until data-source review and limits are approved.
  # workflow_dispatch remains available for manual, bounded runs.
  workflow_dispatch:

jobs:
  run-radar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger market radar endpoint
        env:
          SITE_URL: https://free-llm-api-1-didl.onrender.com
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "${CRON_SECRET}" ]; then echo "CRON_SECRET secret is missing"; exit 1; fi
          echo "Triggering: ${SITE_URL}/api/cron-market"
          curl -fsS -X GET "${SITE_URL}/api/cron-market" \
            -H "Authorization: Bearer ${CRON_SECRET}"
