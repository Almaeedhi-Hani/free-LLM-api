name: OpenCode Lab PR validation
on:
  pull_request:
    paths:
      - 'src/app/admin/opencode-lab/**'
      - 'src/app/api/admin/opencode-lab/**'
      - '.github/workflows/opencode-lab-pr.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Install OpenCode CLI for isolated smoke test
        run: |
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
      - name: Verify OpenCode model catalog
        run: |
          "$HOME/.opencode/bin/opencode" --version
          "$HOME/.opencode/bin/opencode" models | head -n 15
      - name: TypeScript validation
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
