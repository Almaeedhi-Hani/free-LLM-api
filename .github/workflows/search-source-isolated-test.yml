name: Search Source Reliability Test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Compile and test search sources
        run: |
          ./node_modules/.bin/tsc src/lib/storage-mode.ts src/lib/market-intelligence.ts src/lib/market-sources.ts src/lib/open-search-sources.ts --outDir .market-test-build --module commonjs --target es2020 --lib es2020,dom --moduleResolution node --esModuleInterop --skipLibCheck --strict --types node
          node scripts/search-source.test.cjs
          node scripts/geo-discovery-sources.test.cjs
          node --check scripts/opencode-geo-analysis.js
      - name: Bounded live search connectivity test
        run: node scripts/search-source-live-probe.cjs
      - name: Probe Google Suggest directly (one query, read-only)
        run: |
          node - <<'NODE'
          (async () => {
            const u='https://suggestqueries.google.com/complete/search?client=firefox&hl=ar&q='+encodeURIComponent('تأسيس شركة في السعودية');
            try {
              const r=await fetch(u,{signal:AbortSignal.timeout(6000)});
              const body=r.ok?await r.json():null;
              const terms=Array.isArray(body?.[1])?body[1].filter(x=>typeof x==='string'):[];
              console.log('GOOGLE_SUGGEST_DIAGNOSTIC',JSON.stringify({status:r.status,terms:terms.length,examples:terms.slice(0,4)}));
            }catch(e){console.log('GOOGLE_SUGGEST_DIAGNOSTIC',JSON.stringify({status:'unavailable',reason:e.name||'network_error'}));}
          })();
          NODE
      - name: Probe new integrated GEO discovery without production writes
        run: node scripts/geo-discovery-live-probe.cjs
      - name: Install OpenCode
        run: curl -fsSL https://opencode.ai/v2/install | bash
      - name: Probe Beam websearch tool (read-only, 1 query)
        env:
          OPENCODE_DISABLE_AUTOUPDATE: "true"
          OPENCODE_BIN: /home/runner/.opencode/bin/opencode
        run: node scripts/opencode-websearch-probe.cjs
      - name: Upload search diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: search-source-report
          path: |
            .search-probe/report.json
            .search-probe/opencode-websearch-report.json
            .search-probe/geo-discovery-report.json
          if-no-files-found: warn
          retention-days: 7
