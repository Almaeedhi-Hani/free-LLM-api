name: AI Dynamic Optimization Agent (Daily)

on:
  schedule:
    - cron: '0 */2 * * *'  # every 2 hours (boost window 3 days, then daily safe via API guard)
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger cron agent endpoint
        env:
          SITE_URL: https://free-llm-api-1-didl.onrender.com
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "${CRON_SECRET}" ]; then echo "CRON_SECRET secret is missing"; exit 1; fi
          echo "Triggering: ${SITE_URL}/api/cron-agent"
          curl -fsS -X GET "${SITE_URL}/api/cron-agent" \
            -H "Authorization: Bearer ${CRON_SECRET}"