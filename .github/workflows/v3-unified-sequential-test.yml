name: V3 hybrid linked pipeline and independent checks (5-minute test)
on:
  # Owner-approved five-minute rapid test for linked content stages + independent checks.
  # GitHub cron is best-effort; queued full pipelines may exceed five minutes.
  schedule:
    # Temporary diagnostic five-minute cadence: avoid minute 00, keep exactly
    # 12 UTC slots/hour. Safety, Quality and GSC use their own approved crons.
    - cron: '3,8,13,18,23,28,33,38,43,48,53,58 * * * *'
  # One-time smoke test of the merged orchestrator before the next cron fires.
  push:
    branches: [main]
    paths:
      - '.github/workflows/v3-unified-sequential-test.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: read # No issue reconciliation in the Master; independent Safety/Quality own alerts.

concurrency:
  group: v3-unified-sequential-testing
  cancel-in-progress: false

jobs:
  # Only the content pipeline preserves ordering. Even when Radar reports
  # failure GEO still executes (continue-on-error); the aggregate is red.
  linked-pipeline:
    if: github.ref == 'refs/heads/main' && vars.V3_MASTER_PAUSED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      NODE_ENV: test
    steps:
      - name: Diagnose GitHub event delivery and workflow activation (no secrets)
        env:
          TRIGGER_CRON: ${{ github.event.schedule }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          echo "[V3_SCHEDULE_DIAG] event=$GITHUB_EVENT_NAME ref=$GITHUB_REF cron=${TRIGGER_CRON:-none} run_id=$GITHUB_RUN_ID"
          if [ "$GITHUB_EVENT_NAME" = schedule ] && [ "$TRIGGER_CRON" != '3,8,13,18,23,28,33,38,43,48,53,58 * * * *' ]; then
            echo "::error::Unexpected cron source for the only V3 scheduler"
            exit 1
          fi
          # Read GitHub's actual workflow registration state (active/disabled).
          # This helps distinguish a disabled workflow from delayed schedule delivery.
          if workflow_state=$(curl --fail --silent --show-error --max-time 15 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/v3-unified-sequential-test.yml" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>{const a=JSON.parse(s);if(typeof a.state!=="string")process.exit(1);console.log(a.state)})'); then
            echo "[V3_SCHEDULE_DIAG] workflow_state=$workflow_state"
          else
            echo "[V3_SCHEDULE_DIAG] workflow_state=unavailable"
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install pinned test dependencies
        run: npm ci
      - name: Verify the one-cron scheduling and readback contracts
        run: |
          node scripts/v3-unified-schedule.test.cjs
          node scripts/v3-unified-readback.test.cjs

      # Stage 1. Radar informs research, and is inspected before GEO.
      # Do not call rate-limited search APIs every ten minutes.
      - name: W02 - Market Radar persisted data and bounded source tests
        id: w02
        continue-on-error: true
        env:
          GEO_API_KEY: ${{ secrets.GEO_API_KEY }}
        run: |
          # Compile the market test fixture before its radar-budget tests run.
          # Keep provider credentials OUT of mocked test fetches; only the
          # authenticated readback step below receives the existing key.
          env -u GEO_API_KEY -u GEO_API_URL npm run test:market
          node scripts/v3-unified-readback.cjs W02

      # Stage 2. GEO's direct provider contracts are tested with mocked
      # responses; actual W01 provider calls remain manual/owner-controlled.
      - name: W01 - GEO research pipeline contracts and persisted readback
        id: w01
        continue-on-error: true
        env:
          GEO_API_KEY: ${{ secrets.GEO_API_KEY }}
        run: |
          node scripts/geo-direct-model-providers.test.cjs
          node scripts/geo-editorial-no-data-contract.test.cjs
          node scripts/provider-usage-observer.test.cjs
          node scripts/v3-unified-readback.cjs W01

      # Stage 3. Validate publisher quotas and last DB evidence.
      # Never POST a public editorial publication every ten minutes.
      - name: W03 - Publisher policy and stored publication evidence
        id: w03
        continue-on-error: true
        env:
          GEO_API_KEY: ${{ secrets.GEO_API_KEY }}
        run: |
          node scripts/geo-publishing-cadence.test.cjs
          node scripts/v3-unified-readback.cjs W03

      - name: Report linked content checks without masking partial failures
        if: always()
        env:
          W02: ${{ steps.w02.outcome }}
          W01: ${{ steps.w01.outcome }}
          W03: ${{ steps.w03.outcome }}
        shell: bash
        run: |
          {
            echo '## Linked content pipeline (test-only)'
            echo '| Stage | Result |'
            echo '| --- | --- |'
            echo "| W02 Radar | $W02 |"
            echo "| W01 GEO | $W01 |"
            echo "| W03 Publisher policy | $W03 |"
            echo 'W02 failure does not block W01; no production AI calls or publication.'
          } >> "$GITHUB_STEP_SUMMARY"
          for result in "$W02" "$W01" "$W03"; do
            if [ "$result" != success ]; then
              echo "::error::Linked pipeline partial failure"
              exit 1
            fi
          done

  # W05 is not dependent on Radar/GEO/Publisher.
  llm-feed-check:
    if: github.ref == 'refs/heads/main' && vars.V3_MASTER_PAUSED != 'true' && vars.LLM_INDEX_PAUSED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: W05 - Live machine-readable index no-write validation
        id: w05
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node scripts/llm-agent-index.test.cjs
          node scripts/llm-feed-contract.test.cjs
          node scripts/llm-agent-index.cjs --update
          git diff --check
          changes="$(git diff --name-only)"
          if [ -n "$changes" ] && [ "$changes" != "public/llms.txt" ]; then
            echo "::error::Unexpected index test file change"; exit 1;
          fi
          echo "[V3_W05] live_public_feed=success, no_publish=true"


  # W06 is independent; safe fixture only and no bot PR.
  maintenance-check:
    if: github.ref == 'refs/heads/main' && vars.V3_MASTER_PAUSED != 'true' && vars.AUTODEV_PAUSED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: W06 - Safe maintenance policy and regression fixtures
        id: w06
        continue-on-error: true
        run: |
          node scripts/autodev-safe-topic.test.cjs


  # Aggregation depends on check completion only, not their execution order.
  result-summary:
    if: always() && github.ref == 'refs/heads/main' && vars.V3_MASTER_PAUSED != 'true'
    needs: [linked-pipeline, llm-feed-check, maintenance-check]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      PIPELINE: ${{ needs.linked-pipeline.result }}
      INDEX: ${{ needs.llm-feed-check.result }}
      MAINTENANCE: ${{ needs.maintenance-check.result }}
      INDEX_PAUSED: ${{ vars.LLM_INDEX_PAUSED }}
      MAINTENANCE_PAUSED: ${{ vars.AUTODEV_PAUSED }}
    steps:
      - name: Record independent results and fail only on real non-paused failures
        shell: bash
        run: |
          {
            echo '## V3 hybrid five-minute test'
            echo 'Linked: W02 then W01 then W03. Independent: W05, W06.'
            echo 'GSC, Safety Monitor and Quality Watch are independent scheduled workflows.'
            echo '| Component | GitHub result |'
            echo '| --- | --- |'
            echo "| Content pipeline | $PIPELINE |"
            echo "| W05 independent | $INDEX |"
            echo "| W06 independent | $MAINTENANCE |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$PIPELINE" != success ]; then
            echo "::error::Linked content pipeline did not complete successfully"
            exit 1
          fi
          if [ "$INDEX_PAUSED" != true ] && [ "$INDEX" != success ]; then
            echo "::error::Independent W05 check failed"
            exit 1
          fi
          if [ "$MAINTENANCE_PAUSED" != true ] && [ "$MAINTENANCE" != success ]; then
            echo "::error::Independent W06 check failed"
            exit 1
          fi
