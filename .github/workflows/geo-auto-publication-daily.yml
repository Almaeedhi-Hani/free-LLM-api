name: GEO Daily Auto Publication

on:
  workflow_dispatch:
  workflow_call: # callable from the production 10-minute Master; manual remains

permissions:
  contents: read
  actions: read

concurrency:
  group: geo-auto-publication-daily
  cancel-in-progress: false

jobs:
  publish:
    if: vars.V3_MASTER_PAUSED != 'true'
    name: Publish pending GEO visitor copy and FAQs within owner policy
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Select current Saudi cadence
        id: cadence
        env:
          CADENCE_EVENT_CRON: ${{ github.event.schedule }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/scheduled-event-slot.cjs --kind=publication
      - name: Verify endpoint configuration
        if: steps.cadence.outputs.run == 'true'
        env:
          GEO_API_URL: ${{ secrets.GEO_API_URL }}
          GEO_API_KEY: ${{ secrets.GEO_API_KEY }}
        run: |
          if [ -z "$GEO_API_URL" ] || [ -z "$GEO_API_KEY" ]; then
            echo "::error::GEO publication endpoint is not configured"
            exit 1
          fi
      - name: Run source-optional, audit-logged publication
        if: steps.cadence.outputs.run == 'true'
        env:
          GEO_API_URL: ${{ secrets.GEO_API_URL }}
          GEO_API_KEY: ${{ secrets.GEO_API_KEY }}
        run: |
          # DB controls the per-24-hour cap, fingerprint idempotency, and rollback history.
          # Do not automatically retry writes with ambiguous network acknowledgements.
          curl --fail-with-body --retry 0 --max-time 120 -sS \
            -X POST -H "x-geo-api-key: $GEO_API_KEY" \
            -H "x-geo-source-workflow: W03" \
            -H "x-geo-github-run-id: $GITHUB_RUN_ID" \
            -H "x-geo-github-run-attempt: $GITHUB_RUN_ATTEMPT" \
            -H "x-geo-github-event: $GITHUB_EVENT_NAME" \
            "${GEO_API_URL%/}/api/geo/auto-publication"
