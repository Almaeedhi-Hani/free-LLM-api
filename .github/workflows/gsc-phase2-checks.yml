name: GSC Phase 2 checks
on:
  push:
    branches: [feature/gsc-performance-phase2, feature/gsc-daily-monitoring]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
