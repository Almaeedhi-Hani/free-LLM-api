name: GEO Intelligence Analysis

on:
  schedule:
    # Identical UTC timing; each event carries its exact hour to survive delayed runners.
    - cron: '0 1 * * *'
    - cron: '0 3 * * *'
    - cron: '0 5 * * *'
    - cron: '0 7 * * *'
    - cron: '0 9 * * *'
    - cron: '0 11 * * *'
    - cron: '0 13 * * *'
    - cron: '0 15 * * *'
    - cron: '0 17 * * *'
    - cron: '0 19 * * *'
    - cron: '0 21 * * *'
    - cron: '0 23 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/geo-analysis.yml' # One-time persistence-contract smoke after schema guard fix; Saudi cadence unchanged
  workflow_dispatch:  # Manual trigger

permissions:
  contents: read
  actions: read

concurrency:
  group: geo-analysis
  cancel-in-progress: false

jobs:
  geo-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Select current Saudi cadence
        id: cadence
        env:
          CADENCE_EVENT_CRON: ${{ github.event.schedule }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/scheduled-event-slot.cjs --kind=geo

      - name: Analyze GEO with direct free-plan provider fallbacks
        if: steps.cadence.outputs.run == 'true'
        env:
          GEO_API_URL: ${{ secrets.GEO_API_URL }}
          GEO_API_KEY: ${{ secrets.GEO_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          PARALLEL_API_KEY: ${{ secrets.PARALLEL_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          GEO_LLM_MODE: direct
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          node scripts/opencode-geo-analysis.js --full-pipeline

      - name: Guarded automatic publication after a successful GEO cycle
        if: steps.cadence.outputs.run == 'true'
        # Use independently approved DB policy (including high-risk permission, quota).
        # Separate daily auto-publication continues if research is only partial.
        env:
          GEO_API_URL: ${{ secrets.GEO_API_URL }}
          GEO_API_KEY: ${{ secrets.GEO_API_KEY }}
        run: |
          if [ -z "$GEO_API_URL" ] || [ -z "$GEO_API_KEY" ]; then
            echo "::error::Missing GEO API endpoint/key"
            exit 1
          fi
          curl --fail-with-body --retry 0 --max-time 120 -sS \
            -X POST -H "x-geo-api-key: $GEO_API_KEY" \
            -H "x-geo-source-workflow: W01" \
            -H "x-geo-github-run-id: $GITHUB_RUN_ID" \
            -H "x-geo-github-run-attempt: $GITHUB_RUN_ATTEMPT" \
            -H "x-geo-github-event: $GITHUB_EVENT_NAME" \
            "${GEO_API_URL%/}/api/geo/auto-publication"

      - name: Upload Sanitized Report
        if: always() && steps.cadence.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: geo-analysis-report
          path: market-intel/geo-persisted-results.json
          retention-days: 30