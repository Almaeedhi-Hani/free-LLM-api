name: GEO Intelligence Analysis

on:
  # No push trigger: merging changes must never start paid/free provider
  # searches or models. Code validation runs in GEO PR + admin regression CI.
  # Keep only cadence-verified natural schedules and explicit manual dispatch.
  workflow_dispatch:  # Manual trigger
  workflow_call:
    outputs:
      execution_outcome:
        description: Verified GEO execution classification
        value: ${{ jobs.geo-analysis.outputs.execution_outcome }}

permissions:
  contents: read
  actions: read

concurrency:
  group: geo-analysis
  cancel-in-progress: false

jobs:
  geo-analysis:
    if: vars.V3_MASTER_PAUSED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      execution_outcome: ${{ steps.classify.outputs.execution_outcome }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Select current Saudi cadence
        id: cadence
        env:
          CADENCE_EVENT_CRON: ${{ github.event.schedule }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/scheduled-event-slot.cjs --kind=geo

      - name: Analyze GEO with direct free-plan provider fallbacks
        if: steps.cadence.outputs.run == 'true'
        env:
          GEO_API_URL: ${{ secrets.GEO_API_URL }}
          GEO_API_KEY: ${{ secrets.GEO_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          PARALLEL_API_KEY: ${{ secrets.PARALLEL_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          GEO_LLM_MODE: direct
          GEO_OFFICIAL_EVIDENCE: 'true'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          node scripts/opencode-geo-analysis.js --full-pipeline

      - name: Classify verified execution outcome
        id: classify
        if: always() && steps.cadence.outputs.run == 'true'
        run: |
          node -e 'const fs=require("node:fs"); const r=JSON.parse(fs.readFileSync("market-intel/geo-persisted-results.json")); const c=require("./scripts/geo-editorial-no-data-contract.cjs"); const outcome=r.dashboard_synced===true?c.classifyGeoOutcome(r.stages):"failed"; fs.appendFileSync(process.env.GITHUB_OUTPUT,"execution_outcome="+outcome+"\n");'
      - name: Guarded automatic publication after a successful GEO cycle
        if: steps.cadence.outputs.run == 'true'
        # Use independently approved DB policy (including high-risk permission, quota).
        # Separate daily auto-publication continues if research is only partial.
        env:
          GEO_API_URL: ${{ secrets.GEO_API_URL }}
          GEO_API_KEY: ${{ secrets.GEO_API_KEY }}
        run: |
          # A verified empty editorial batch is an honest no-data research
          # outcome, but must NOT unlock the W01 publication endpoint.
          # Other partial/invalid status or missing artifact fails closed.
          decision="$(node scripts/geo-editorial-no-data-contract.cjs --decision market-intel/geo-persisted-results.json)" || {
            echo "::error::W01 publication readiness could not be verified"
            exit 1
          }
          if [ "$decision" = "skip_no_data" ]; then
            echo "[W01_PUBLICATION] SKIP clean editorial success_no_data; independent W03 remains scheduled"
            exit 0
          fi
          if [ "$decision" != "ready" ]; then
            echo "::error::W01 publication readiness rejected"
            exit 1
          fi
          if [ -z "$GEO_API_URL" ] || [ -z "$GEO_API_KEY" ]; then
            echo "::error::Missing GEO API endpoint/key"
            exit 1
          fi
          curl --fail-with-body --retry 0 --max-time 120 -sS \
            -X POST -H "x-geo-api-key: $GEO_API_KEY" \
            -H "x-geo-source-workflow: W01" \
            -H "x-geo-github-run-id: $GITHUB_RUN_ID" \
            -H "x-geo-github-run-attempt: $GITHUB_RUN_ATTEMPT" \
            -H "x-geo-github-event: $GITHUB_EVENT_NAME" \
            "${GEO_API_URL%/}/api/geo/auto-publication"

      - name: Upload Sanitized Report
        if: always() && steps.cadence.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: geo-analysis-report
          path: market-intel/geo-persisted-results.json
          retention-days: 30