name: Radar live read-only smoke
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/lib/radar-*.ts'
      - 'src/lib/market-intelligence.ts'
      - 'src/lib/market-sources.ts'
      - 'src/lib/open-search-sources.ts'
      - 'scripts/radar-*.cjs'
      - '.github/workflows/radar-live-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: 'true'
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Compile and run isolated market tests
        run: npm run test:market
      - name: Verify credentialed provider failover with mocked API responses
        run: node scripts/provider-search.test.cjs
      # Bing RSS and DuckDuckGo may block CI runners independent of code correctness.
      # Keep the live probe visible as a diagnostic; the deterministic market tests above remain blocking.
      - name: Probe live public search (external diagnostic, non-blocking)
        continue-on-error: true
        run: node scripts/radar-live-smoke.cjs
      - name: Explain external source availability
        run: echo '::notice::Bing RSS/DuckDuckGo availability is diagnostic only; run the manual credentialed provider smoke for live Exa/Tavily/Parallel validation.'
