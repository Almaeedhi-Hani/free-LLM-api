name: Phase 2 SQL security tests
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: phase2_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d phase2_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Run security migration tests against disposable PostgreSQL 17
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: test-only-password
          PGDATABASE: phase2_test
        run: |
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/phase2-security.sql
          # Proposal ONLY, using this disposable CI Postgres 17 service.
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/phase2-provider-quota-prepared.sql
          # Open 20 independent PG sessions in bursts; still disposable DB only.
          bash tests/sql/phase2-provider-quota-concurrency.sh
          # Actual search/LLM adapters through mocked HTTP; no provider calls.
          node scripts/v3-provider-preflight-prepared.test.cjs
