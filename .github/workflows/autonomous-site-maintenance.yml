name: Autonomous Site Maintenance (bounded)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/autonomous-site-maintenance.yml' # one-time rollout verification
      - 'scripts/autodev-safe-topic.test.cjs' # verify guard after test refinements
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: autonomous-site-maintenance
  cancel-in-progress: false

jobs:
  low-risk-development:
    if: github.ref == 'refs/heads/main' && vars.AUTODEV_PAUSED != 'true' && vars.V3_MASTER_PAUSED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: 'true'
      NODE_ENV: test
    steps:
      - name: Checkout main without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Select current Saudi cadence
        id: cadence
        env:
          CADENCE_EVENT_CRON: ${{ github.event.schedule }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/scheduled-event-slot.cjs --kind=maintenance
      - run: npm ci
        if: steps.cadence.outputs.run == 'true'
      - name: Apply at most one source-backed live-service SEO improvement
        if: steps.cadence.outputs.run == 'true'
        id: task
        shell: bash
        run: |
          node scripts/autodev-safe-topic.test.cjs
          node scripts/autodev-safe-topic.cjs --apply
          if git diff --quiet -- src/data/content-tree.json; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'No additional safe technical work. No empty PR.'
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            node scripts/autodev-safe-topic.cjs --verify
          fi
      - name: Verify exact file scope and no untracked edits
        if: steps.task.outputs.changed == 'true'
        shell: bash
        run: |
          git diff --check
          test "$(git diff --name-only)" = 'src/data/content-tree.json'
          test -z "$(git ls-files --others --exclude-standard)"
      - name: Run complete relevant regressions and build before any repository write token is used
        if: steps.task.outputs.changed == 'true'
        shell: bash
        run: |
          npm run test:market
          npm run test:editorial
          npm run test:impact
          npm run test:packages
          npm run build
      - name: Open a bounded PR and merge after successful tests
        if: steps.task.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.AUTODEV_GITHUB_TOKEN || github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branch="autodev/live-links-$GITHUB_RUN_ID"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$branch"
          git add -- src/data/content-tree.json
          git commit -m 'seo: add one verified reciprocal live-service link'
          gh auth setup-git
          git push origin "$branch"
          pr_url="$(gh pr create --base main --head "$branch" \
            --title 'Autonomous low-risk SEO: one live service connection' \
            --body 'One reciprocal internal link between existing service pages. The strict guard, market/editorial/impact/package test suites and production build passed before this PR was created. No legal facts, publication policy, pricing, database, security settings, scripts or application source files changed. GitHub Actions-created PRs do not necessarily trigger separate CI; all tests ran in the creating workflow. If merge policy blocks the PR, it must remain unmerged.')"
          echo "Auto-maintenance PR: $pr_url"
          # GitHub may briefly reject a freshly created PR while its base mergeability settles.
          # Never retry across a real main-branch change: pre-merge tests covered this exact base.
          expected_base="$(git rev-parse HEAD^)"
          merged=false
          for attempt in 1 2 3; do
            current_base="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
            if [ "$current_base" != "$expected_base" ]; then
              echo "::error::main changed after validation ($expected_base -> $current_base); refusing stale merge"
              exit 1
            fi
            if gh pr merge "$pr_url" --squash --delete-branch; then
              merged=true
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::PR merge temporarily unavailable; rechecking unchanged main before retry"
              sleep "$((attempt * 4))"
            fi
          done
          if [ "$merged" != "true" ]; then
            echo "::error::PR merge remained unavailable; leaving PR open for inspection"
            exit 1
          fi
          deployed_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          echo "Merged into main: $deployed_sha"
          gh workflow run production-readonly-acceptance.yml --ref main -f expected_sha="$deployed_sha"
      - name: Summarize scheduled maintenance outcome
        if: always()
        shell: bash
        env:
          TASK_CHANGED: ${{ steps.task.outputs.changed }}
        run: |
          {
            echo '## Autonomous site maintenance — execution evidence'
            echo "- GitHub Actions run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- Safe technical change selected: ${TASK_CHANGED:-unknown}"
            echo '- Failed checks or repository permissions prevent unattended merging.'
            echo '- A merged PR is not proof of Render deployment; verify production acceptance separately.'
          } >> "$GITHUB_STEP_SUMMARY"
