name: Admin regression checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Mobile floating header interaction and design contract
        run: node scripts/mobile-header-contract.test.cjs
      - name: Market intelligence CRUD and failure-mode tests
        run: npm run test:market
      - name: Verify original multilingual packages and pricing
        run: npm run test:packages
      - name: Verify W05 automatic index PR fails closed until its independent checks pass
        run: node scripts/llm-pr-ci-gate.test.cjs
      - name: Evidence-gated organic ranking, indexing, AI visibility and conversion tests
        run: npm run test:visibility
      - name: OpenCode multilingual topic architect and source-diversity contract
        run: node scripts/geo-opencode-planner.test.cjs
      - name: Cross-site editorial routing, review and publication contract
        run: npm run test:editorial
      - name: GEO persistence and pipeline truthfulness tests
        run: npm run test:geo-persist
      - name: GEO agent tests
        run: npm run test:agent
      - name: GEO Content & Impact Center contracts and fail-closed auto publication
        run: npm run test:impact
      - name: Phase 3 offline evidence review with current keyword and source policies
        run: |
          npx tsc src/lib/keyword-relevance-eval.ts --outDir .phase3-eval-build --module commonjs --target es2020 --lib es2020,dom --moduleResolution node --esModuleInterop --skipLibCheck --strict --types node
          node scripts/v3-phase3-review-gates.test.cjs
      - name: Content storage tests
        run: npm run test:storage
      - name: Cron guard tests
        run: npx tsc src/lib/cron-agent-guards.ts --outDir .cron-test-build --module commonjs --target es2020 --skipLibCheck --types node && node scripts/cron-agent-guards.test.cjs
      - name: Production build
        run: npm run build
      - name: Validate rendered SEO metadata, visible offers and LLM feed (isolated file fixture)
        run: |
          # Runtime production intentionally fails closed without Supabase secrets.
          # Exercise SSR without secrets via dev server; production build is gated above.
          (NODE_ENV=development npm run dev -- -p 3000 > /tmp/seo-render.log 2>&1 &)
          ready=0
          for i in $(seq 1 50); do
            if curl -fsS --max-time 12 http://127.0.0.1:3000/ >/dev/null 2>&1; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" != "1" ]; then
            tail -80 /tmp/seo-render.log
            echo "SSR fixture did not become ready"
            exit 1
          fi
          SEO_TEST_BASE_URL=http://127.0.0.1:3000 node scripts/check-public-seo.cjs
          curl -fsS http://127.0.0.1:3000/api/llm-version > /tmp/seo-llm.txt
          grep -q "Service fee: 27000 SAR" /tmp/seo-llm.txt
          grep -q "Service fee: 77000 SAR" /tmp/seo-llm.txt
          node -e 'const t=require("node:fs").readFileSync("/tmp/seo-llm.txt","utf8").toLowerCase();const blocked=[["j","c"," ","group"].join(""),["jc","group","ksa"].join(""),["investinsaudi","-services",".sa"].join("")];if(blocked.some(x=>t.includes(x))){console.error("Disallowed outside-party reference in public LLM feed");process.exit(1)}'

