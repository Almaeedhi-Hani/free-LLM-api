name: Admin regression checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Market intelligence CRUD and failure-mode tests
        run: npm run test:market
      - name: Verify original multilingual packages and pricing
        run: npm run test:packages
      - name: GEO agent tests
        run: npm run test:agent
      - name: Content storage tests
        run: npm run test:storage
      - name: Cron guard tests
        run: npx tsc src/lib/cron-agent-guards.ts --outDir .cron-test-build --module commonjs --target es2020 --skipLibCheck --types node && node scripts/cron-agent-guards.test.cjs
      - name: Production build
        run: npm run build
      - name: Validate rendered SEO metadata, visible offers and LLM feed
        run: |
          (npm run start -- -p 3000 > /tmp/seo-render.log 2>&1 &)
          for i in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then break; fi
            sleep 2
          done
          SEO_TEST_BASE_URL=http://127.0.0.1:3000 node scripts/check-public-seo.cjs
          curl -fsS http://127.0.0.1:3000/api/llm-version > /tmp/seo-llm.txt
          grep -q "Service fee: 28000 SAR" /tmp/seo-llm.txt
          grep -q "Service fee: 78000 SAR" /tmp/seo-llm.txt
          if grep -Eiq 'JC Group|jcgroupksa|investinsaudi-services[.]sa' /tmp/seo-llm.txt; then
            echo "Disallowed company/reference leaked into LLM feed"
            exit 1
          fi

