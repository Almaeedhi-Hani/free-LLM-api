name: Radar provider smoke (manual, feature branch)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: radar-provider-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    name: Live AR EN ZH (3 requests max)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CI: 'true'
      NODE_ENV: test
    steps:
      - name: Check out the selected feature-branch commit
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify isolated radar fixture tests without external calls
        run: npm run test:market
      - name: Verify real provider candidates for Arabic, English and Chinese
        env:
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          PARALLEL_API_KEY: ${{ secrets.PARALLEL_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: node scripts/radar-provider-live-smoke.cjs
