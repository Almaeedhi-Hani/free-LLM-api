# One-time SYNTHETIC GitHub alert delivery test for corrected issue-cache code.
# NEVER merge to main. No production failure simulated.
name: V3 Phase 2 corrected synthetic issue delivery
on:
  push:
    branches: [chore/phase2-issue-delivery-rehearsal-fixed-20261120]
    paths: ['.github/workflows/v3-phase2-issue-delivery-fixed-rehearsal.yml']
permissions:
  contents: read
  issues: write
jobs:
  exercise:
    if: github.repository == 'Almaeedhi-Hani/free-LLM-api'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Test issue create update dedup and close without touching production
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const {createClient}=require('./scripts/v3-phase2-monitor.cjs');
          const client=createClient({repository:process.env.GITHUB_REPOSITORY,token:process.env.GH_TOKEN});
          const title='[V3 rehearsal only] Corrected Phase 2 synthetic issue delivery 2026-11-20';
          const body='SYNTHETIC REHEARSAL ONLY. No real scheduled failure, provider call, production incident, publication or policy change.';
          (async()=>{
            const first=await client.upsertIssue({title,body,label:'failure'});
            if(first.result!=='created')throw Error('Expected exactly one new synthetic Issue');
            const second=await client.upsertIssue({title,body:body+'\\nSecond delivery, same ID.',label:'failure'});
            if(second.result!=='updated'||first.number!==second.number)throw Error('Duplicate issue detected');
            const closed=await client.resolveIssue(title,body+'\\nRehearsal passed, closed.');
            if(closed.result!=='resolved'||closed.number!==first.number)throw Error('Could not close test issue');
            console.log('V3_PHASE2_REHEARSAL_SUCCESS issue='+first.number+' created=1 updated_same=true closed=true');
          })().catch(error=>{console.error('REHEARSAL FAILED '+error.message);process.exitCode=1;});
          NODE
