name: GEO NVIDIA + OpenRouter Free Capability Probe

on:
  pull_request:
    paths:
      - '.github/workflows/geo-provider-capability-smoke.yml'
      - 'scripts/geo-provider-capability-smoke.cjs'
      - 'scripts/geo-provider-capability-smoke.test.cjs'
      - 'scripts/geo-semantic-review-smoke.cjs'
      - 'scripts/geo-semantic-review-smoke.test.cjs'
      - 'src/lib/geo-semantic-review.cjs'
      - 'scripts/geo-openrouter-account-benchmark.cjs'
      - 'scripts/geo-openrouter-account-benchmark.test.cjs'
  push:
    branches: [main]
    paths:
      - 'scripts/geo-openrouter-account-benchmark.cjs'
  workflow_dispatch:
    inputs:
      semantic_review:
        description: 'Run the trilingual synthetic semantic benchmark instead of the old capability probe'
        type: boolean
        default: false
      free_accounts_verified:
        description: 'Both configured accounts are verified no-charge; never bypass quota guard'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: geo-free-provider-capabilities
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Test safe candidate catalog, JSON checks, and strict $0 model selection
        run: |
          node --check scripts/geo-provider-capability-smoke.cjs
          node scripts/geo-provider-capability-smoke.test.cjs
          node scripts/geo-semantic-review-smoke.test.cjs
          node scripts/geo-openrouter-account-benchmark.test.cjs

      - name: Probe NVIDIA free-hosted prototypes and live zero-priced OpenRouter models
        if: github.event_name == 'workflow_dispatch' && !inputs.semantic_review
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          node scripts/geo-provider-capability-smoke.cjs

      - name: Upload sanitized result (no prompt or key values)
        if: always() && github.event_name == 'workflow_dispatch' && !inputs.semantic_review
        uses: actions/upload-artifact@v4
        with:
          name: geo-provider-capability-probe
          path: market-intel/model-capability-smoke.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Run isolated semantic benchmark with verified no-charge accounts
        if: github.event_name == 'workflow_dispatch' && inputs.semantic_review && inputs.free_accounts_verified
        env:
          GEO_SEMANTIC_FREE_ACCOUNTS_VERIFIED: 'true'
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEO_API_KEY: ${{ secrets.GEO_API_KEY }}
        run: node scripts/geo-semantic-review-smoke.cjs

      - name: Upload sanitized semantic benchmark
        if: always() && github.event_name == 'workflow_dispatch' && inputs.semantic_review && inputs.free_accounts_verified
        uses: actions/upload-artifact@v4
        with:
          name: geo-semantic-review-smoke
          path: market-intel/semantic-review-smoke.json
          retention-days: 7
          if-no-files-found: ignore

      # One bounded commissioning check on this explicit implementation path.
      # No recurring schedule, no publishing, no Groq or NVIDIA inference.
      - name: Verify OpenRouter account and run bounded free-only synthetic review
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_attempt == 1
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: node scripts/geo-openrouter-account-benchmark.cjs

      - name: Upload sanitized OpenRouter commissioning report
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_attempt == 1
        uses: actions/upload-artifact@v4
        with:
          name: geo-openrouter-account-benchmark
          path: market-intel/openrouter-account-benchmark.json
          retention-days: 7
          if-no-files-found: ignore
