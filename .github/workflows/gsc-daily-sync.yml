name: GSC daily metrics sync
on:
  schedule:
    # Same UTC trigger hours as the original 0 0-22/2 cron. Individual expressions
    # preserve the scheduled hour when GitHub queues the job past that hour.
    - cron: '0 0 * * *'
    # Owner-approved replacement of 05:00 KSA with 03:45 KSA (00:45 UTC).
    - cron: '45 0 * * *'
    - cron: '0 4 * * *'
    - cron: '0 6 * * *'
    - cron: '0 8 * * *'
    - cron: '0 10 * * *'
    - cron: '0 12 * * *'
    - cron: '0 14 * * *'
    - cron: '0 16 * * *'
    - cron: '0 18 * * *'
    - cron: '0 20 * * *'
    - cron: '0 22 * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: gsc-measured-sync
  queue: max
  cancel-in-progress: false
jobs:
  sync:
    if: vars.V3_MASTER_PAUSED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Resolve the original Saudi cadence slot
        id: cadence
        env:
          GSC_EVENT_CRON: ${{ github.event.schedule }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/gsc-scheduled-slot.cjs
      - name: Verify sync configuration
        if: steps.cadence.outputs.run == 'true'
        env:
          GSC_SYNC_URL: ${{ secrets.GSC_SYNC_URL }}
          GSC_CRON_SECRET: ${{ secrets.GSC_CRON_SECRET }}
        run: |
          if [ -z "$GSC_SYNC_URL" ] || [ -z "$GSC_CRON_SECRET" ]; then
            echo "::error::Configure GSC_SYNC_URL and GSC_CRON_SECRET in GitHub Actions secrets"
            exit 1
          fi
      - name: Claim the scheduled slot before sending the request
        if: steps.cadence.outputs.marker != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.cadence.outputs.marker }}
          path: ${{ runner.temp }}/gsc-scheduled-slot.txt
          if-no-files-found: error
          retention-days: 30
      - name: Collect GSC metrics
        if: steps.cadence.outputs.run == 'true'
        env:
          GSC_SYNC_URL: ${{ secrets.GSC_SYNC_URL }}
          GSC_CRON_SECRET: ${{ secrets.GSC_CRON_SECRET }}
        run: |
          curl --fail-with-body --max-time 90 -sS -H "Authorization: Bearer $GSC_CRON_SECRET" "$GSC_SYNC_URL"
