name: One-time Stage2 real watchdog weekly and quality acceptance
on:
  push:
    branches:
      - verification/stage2-real-issue-reconcile-20261123
    paths:
      - .github/workflows/stage2-operational-acceptance-once.yml
permissions:
  contents: read
  actions: read
  issues: write
concurrency:
  group: v3-stage2-safety-issues
  cancel-in-progress: false
jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Offline contract regression (no provider calls)
        run: node scripts/v3-phase2-monitor.test.cjs
      - name: Real watchdog protected readback and Issue reconcile
        env:
          GH_TOKEN: ${{ github.token }}
          GEO_API_KEY: ${{ secrets.GEO_API_KEY }}
          V3_MASTER_PAUSED: ${{ vars.V3_MASTER_PAUSED }}
          MARKET_RADAR_PAUSED: ${{ vars.MARKET_RADAR_PAUSED }}
          LLM_INDEX_PAUSED: ${{ vars.LLM_INDEX_PAUSED }}
          AUTODEV_PAUSED: ${{ vars.AUTODEV_PAUSED }}
        run: node scripts/v3-phase2-monitor.cjs --mode=watchdog
  weekly:
    needs: watchdog
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Real weekly report Issue update using protected Supabase readback
        env:
          GH_TOKEN: ${{ github.token }}
          GEO_API_KEY: ${{ secrets.GEO_API_KEY }}
          V3_MASTER_PAUSED: ${{ vars.V3_MASTER_PAUSED }}
          MARKET_RADAR_PAUSED: ${{ vars.MARKET_RADAR_PAUSED }}
          LLM_INDEX_PAUSED: ${{ vars.LLM_INDEX_PAUSED }}
          AUTODEV_PAUSED: ${{ vars.AUTODEV_PAUSED }}
        run: node scripts/v3-phase2-monitor.cjs --mode=weekly
  quality:
    needs: weekly
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Verify stage2 quality and V3 trilingual Evals offline
        run: |
          node scripts/v3-stage2-quality-audit.test.cjs
          npx tsc src/lib/keyword-relevance-eval.ts src/lib/source-policy.ts --target es2020 --module commonjs --rootDir src --outDir .v3-evals-build --lib es2020,dom --moduleResolution node --esModuleInterop --skipLibCheck --strict --types node
          node scripts/v3-regression-evals.test.cjs
      - name: Real complete production quality scan and live Issue reconciliation
        env:
          GH_TOKEN: ${{ github.token }}
          GEO_API_KEY: ${{ secrets.GEO_API_KEY }}
          V3_EVAL_OUTCOME: success
        run: node scripts/v3-stage2-quality-audit.cjs
