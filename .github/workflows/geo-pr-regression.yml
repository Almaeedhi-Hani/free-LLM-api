name: GEO PR regression checks
on:
  pull_request:
    paths:
      - 'scripts/geo-opencode-planner.cjs'
      - 'scripts/opencode-geo-analysis.js'
      - 'scripts/geo-discovery-sources.cjs'
      - 'scripts/geo-discovery-persistence.test.cjs'
      - 'scripts/geo-batched-persistence.test.cjs'
      - 'scripts/geo-suggest-fallback.test.cjs'
      - 'scripts/geo-evidence-quality.test.cjs'
      - 'package.json'
      - 'scripts/geo-editorial-prompt.test.cjs'
      - 'scripts/geo-provider-fallback.test.cjs'
      - 'scripts/geo-direct-model-providers.cjs'
      - 'scripts/geo-direct-model-providers.test.cjs'
      - 'scripts/geo-direct-stage-integration.test.cjs'
      - 'scripts/geo-direct-prompt-quota.test.cjs'
      - 'scripts/geo-opencode-planner.cjs'
      - 'scripts/geo-compact-model-fallback.test.cjs'
      - 'scripts/geo-batched-persistence.test.cjs'
      - 'scripts/geo-autopilot-reliability.test.cjs'
      - 'src/app/api/geo/discovery/route.ts'
      - 'src/app/api/admin/geo-engine/route.ts'
      - 'src/components/GeoEngineMonitor.tsx'
      - 'scripts/geo-opportunity-contract.cjs'
      - 'scripts/geo-opportunity-contract.test.cjs'
      - 'src/data/content-tree.json'
      - 'src/lib/geo-ingest.ts'
      - 'src/lib/geo-draft-quality.ts'
      - 'src/lib/editorial-workflow.ts'
      - 'src/lib/content-tree.ts'
      - '.github/workflows/geo-pr-regression.yml'
      - '.github/workflows/geo-analysis.yml'
      - 'src/app/api/admin/geo-engine/route.ts'
      - 'src/components/GeoEngineMonitor.tsx'
      - 'scripts/geo-secret-weapon-schedule.test.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  geo-static-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Syntax checks
        run: |
          node --check scripts/geo-opencode-planner.cjs
          node --check scripts/opencode-geo-analysis.js
          node --check scripts/geo-editorial-prompt.test.cjs
          node --check scripts/geo-provider-fallback.test.cjs
      - name: Verify GEO autopilot schedule and independent publishing
        run: node scripts/geo-secret-weapon-schedule.test.cjs
      - name: Adaptive fallback and keyword attribution regression
        run: node scripts/geo-autopilot-reliability.test.cjs
      - name: Multilingual editorial prompt
        run: node scripts/geo-editorial-prompt.test.cjs
      - name: Free-model fallback safety
        run: node scripts/geo-provider-fallback.test.cjs
      - name: Four free-plan direct providers and multilingual failover
        run: node scripts/geo-direct-model-providers.test.cjs && node scripts/geo-direct-stage-integration.test.cjs && node scripts/geo-direct-prompt-quota.test.cjs
      - name: Opportunity contract and partial persistence regression
        run: node scripts/geo-opportunity-contract.test.cjs
      - name: Multilingual evidence-to-prompt integration
        run: node scripts/geo-opencode-planner.test.cjs
      - name: GEO ingest and persistence integration with mocked storage
        run: npm run test:geo-persist
      - name: Editorial review and publication gate integration
        run: npm run test:editorial
