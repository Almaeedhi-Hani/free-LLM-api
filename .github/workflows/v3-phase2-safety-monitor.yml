name: V3 Stage 2 safety monitor and weekly report
on:
  schedule:
    - cron: '17 */6 * * *' # Read-only watchdog every 6 UTC hours
    - cron: '0 6 * * 0'   # Weekly Sunday 09:00 Saudi time
  workflow_run:
    workflows:
      - 'GEO Intelligence Analysis'
      - 'Market Intelligence Radar (Independent)'
      - 'GEO Daily Auto Publication'
      - 'GSC daily metrics sync'
      - 'LLM Agent Feed Quality & Index'
      - 'Autonomous Site Maintenance (bounded)'
    types: [completed]
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run tests only, watchdog issue reconcile, or weekly issue report'
        required: true
        default: 'dry-run'
        type: choice
        options: [dry-run, watchdog, weekly]

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: v3-stage2-safety-issues
  cancel-in-progress: false

jobs:
  monitor:
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Exercise offline monitor safety and deduplicated issue contracts
        run: |
          node --check scripts/v3-phase2-monitor.cjs
          node scripts/v3-phase2-monitor.test.cjs
      - name: Run scheduled watchdog or weekly report (manual defaults to no writes)
        env:
          GH_TOKEN: ${{ github.token }}
          V3_MASTER_PAUSED: ${{ vars.V3_MASTER_PAUSED }}
          MARKET_RADAR_PAUSED: ${{ vars.MARKET_RADAR_PAUSED }}
          LLM_INDEX_PAUSED: ${{ vars.LLM_INDEX_PAUSED }}
          AUTODEV_PAUSED: ${{ vars.AUTODEV_PAUSED }}
          # Reuse the already-configured GEO API key (also used by Stage-2 quality).
          # Supabase service_role remains ONLY on the existing Render server.
          GEO_API_KEY: ${{ secrets.GEO_API_KEY }}
          REQUEST_MODE: ${{ inputs.mode }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
        shell: bash
        run: |
          set -euo pipefail
          mode=watchdog
          if [ "${SCHEDULE_CRON:-}" = '0 6 * * 0' ]; then mode=weekly; fi
          if [ "${GITHUB_EVENT_NAME}" = 'workflow_dispatch' ]; then
            mode="${REQUEST_MODE:-dry-run}"
          fi
          if [ "$mode" = 'dry-run' ]; then
            echo '[V3_SAFETY] dry-run only: issue writes and provider calls skipped'
            exit 0
          fi
          node scripts/v3-phase2-monitor.cjs "--mode=$mode"

  failure-alert:
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify isolated failure webhooks and trusted head-repository rules
        run: node scripts/v3-phase2-monitor.test.cjs
      - name: Reconcile failure alert for a completed trusted real scheduled run
        env:
          GH_TOKEN: ${{ github.token }}
          V3_MASTER_PAUSED: ${{ vars.V3_MASTER_PAUSED }}
          MARKET_RADAR_PAUSED: ${{ vars.MARKET_RADAR_PAUSED }}
          LLM_INDEX_PAUSED: ${{ vars.LLM_INDEX_PAUSED }}
          AUTODEV_PAUSED: ${{ vars.AUTODEV_PAUSED }}
        run: node scripts/v3-phase2-monitor.cjs --mode=failure
